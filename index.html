<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fb"><title>Northstar Interview | Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#14263e;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}header{height:76px;background:white;border-bottom:1px solid #e4eaf1;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1160px)/2))}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;letter-spacing:-.5px}.mark{width:29px;height:29px;border-radius:9px;background:#2867db;display:grid;place-items:center;color:white;font-size:17px}.pill{border-radius:99px;background:#eaf2ff;color:#235bb7;padding:8px 13px;font-size:12px;font-weight:750;letter-spacing:.08em}.shell{max-width:1160px;margin:auto;padding:42px 24px 70px}.topline{font-size:13px;font-weight:750;color:#57708c;text-transform:uppercase;letter-spacing:.12em}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:30px;margin-top:18px}.card{background:white;border:1px solid #e2e8f1;border-radius:18px;box-shadow:0 12px 35px rgba(33,63,104,.05)}.main{padding:42px;min-height:570px}.side{padding:27px;height:max-content}.side h3{margin:0 0 22px;font-size:15px}.step{display:flex;align-items:center;gap:12px;margin:0 0 22px;color:#7890a8;font-size:14px;font-weight:600}.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid #cbd8e6;display:grid;place-items:center;font-size:12px;flex:none}.step.active{color:#155dc7}.step.active .dot{background:#2867db;color:#fff;border-color:#2867db}.step.done{color:#3a536c}.step.done .dot{background:#dff4eb;color:#15966e;border-color:#dff4eb}.side hr{border:0;border-top:1px solid #e9eef5;margin:24px 0}.support{color:#627a92;font-size:13px;line-height:1.6}h1{font-size:38px;line-height:1.17;letter-spacing:-1.2px;margin:13px 0 16px}p{color:#5c7189;line-height:1.65}.lead{font-size:16px;max-width:630px}.welcome-art{height:170px;border-radius:14px;margin:30px 0;background:linear-gradient(120deg,#dfeeff,#f7fbff 60%,#e4f4ee);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.bubble{width:120px;height:120px;background:#fff;border-radius:21px;box-shadow:0 14px 30px #a4bad143;display:grid;place-items:center;font-size:56px;transform:rotate(-8deg)}.welcome-art:before,.welcome-art:after{content:"";position:absolute;width:140px;height:140px;border:2px solid #b8d3f4;border-radius:50%}.welcome-art:before{left:8%;top:60%}.welcome-art:after{right:9%;bottom:54%}.meta{display:flex;gap:30px;flex-wrap:wrap;margin:24px 0 32px;font-size:14px;color:#36516d}.meta b{display:block;color:#14263e;margin-bottom:4px}.btn{border:0;background:#2867db;color:white;padding:14px 24px;border-radius:9px;font-weight:700;box-shadow:0 5px 13px #2867db2e}.btn:hover{background:#1c55be}.btn.secondary{background:#edf3fb;color:#2457a6;box-shadow:none}.btn.ghost{background:white;color:#49637f;border:1px solid #dce5ef;box-shadow:none}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px}.info{background:#f3f7fc;border:1px solid #e4ecf5;border-radius:12px;padding:20px 22px;margin:22px 0}.info h3{margin:0 0 7px;font-size:15px}.info p{margin:0;font-size:14px}.checklist{display:grid;gap:14px;margin-top:28px}.item{display:flex;gap:15px;align-items:flex-start;padding:17px;border:1px solid #e4ebf3;border-radius:11px}.icon{font-size:20px}.item strong{display:block;margin-bottom:4px}.item span{color:#6a7f94;font-size:14px}.video{position:relative;background:#122238;border-radius:13px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;color:#c4d5e6;margin:22px 0}.video video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.video.playback video{transform:none;object-fit:contain}.video .placeholder{text-align:center;font-size:14px}.video .placeholder em{display:block;font-size:50px;font-style:normal;margin-bottom:8px}.video-label{position:absolute;bottom:13px;left:14px;background:#0009;padding:7px 10px;border-radius:6px;color:white;font-size:12px}.device-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f6;font-size:14px}.status{font-weight:700;color:#168665}.status.bad{color:#b95142}.meter{height:7px;width:105px;background:#e7edf3;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#2cbf8c;transition:width .1s}.question{font-size:28px;line-height:1.35;letter-spacing:-.5px;font-weight:700;margin:18px 0 25px}.timer{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;background:#eaf2ff;color:#1e60c9;border-radius:8px;font-weight:800;font-variant-numeric:tabular-nums}.timer.recording{background:#fff0ee;color:#ca4539}.progress{height:7px;background:#e7edf6;border-radius:20px;overflow:hidden;margin:24px 0 32px}.progress i{display:block;height:100%;background:#2867db;transition:width .3s}.small{font-size:13px}.recorded{color:#147d5d;font-weight:700}.warning{color:#a66a17;background:#fff7e7;border-radius:8px;padding:11px 13px;font-size:13px;margin-top:13px}.complete{width:76px;height:76px;background:#dcf7eb;color:#15956e;border-radius:50%;display:grid;place-items:center;font-size:38px;margin-bottom:25px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:-1}.side .steps{display:flex;flex-wrap:wrap;gap:10px}.step{margin:0;font-size:12px}.side hr,.support{display:none}.main{padding:27px;min-height:auto}h1{font-size:31px}.shell{padding-top:24px}}@media(max-width:480px){header{height:65px;padding:0 18px}.shell{padding:20px 15px 50px}.main,.side{padding:22px}.brand{font-size:17px}.pill{font-size:10px}.question{font-size:22px}}
</style></head><body><header><div class="brand"><div class="mark">✦</div>northstar <span style="font-weight:400;color:#8294a7">/ interviews</span></div><div class="pill">PRACTICE DEMO</div></header><div class="shell"><div class="topline" id="eyebrow">Candidate experience</div><div class="layout"><main class="card main" id="main"></main><aside class="card side"><h3>Your interview journey</h3><div class="steps" id="steps"></div><hr><div class="support">✦ &nbsp; After each recording, rewatch, retry, or continue. Videos stay in this browser session only.</div></aside></div></div><script>
const names=['Welcome','Instructions','Device check','Practice','Interview','Complete'];
const questionBank={"motivation":["What attracts you to Swire and to the Swire Management Programme at this stage of your career?","Why do you want to build your career with Swire, and what do you hope to gain from the Management Programme?","What interests you about a programme that offers rotations across different functions and businesses?","How does the Swire Management Programme fit with your long-term career goals?","What makes Swire's approach to developing future leaders appealing to you?","Why would you choose a rotational management programme over a role focused on one function from the start?"],"leadership":["Tell us about a time you took the lead on a project or initiative. What was your contribution and what happened?","Describe a situation in which you identified something that needed to change and took action without being asked.","Give an example of a time you motivated others to work towards a shared goal.","Tell us about a time you had to lead a team through uncertainty. How did you approach it?","Describe a time you influenced an outcome despite having no formal authority.","What is a time when you stepped forward to take responsibility for a difficult task?"],"teamwork":["Tell us about a time you worked with people whose views differed from yours. How did you reach an outcome?","Describe a disagreement within a team and the role you played in resolving it.","Give an example of a time you collaborated with people who had different working styles. What did you do?","Tell us about a team project that did not go smoothly. How did you contribute to moving it forward?","Describe a time you had to gain the cooperation of someone who was initially reluctant to work with you.","What is an example of a time you helped a team perform better together?"],"adaptability":["Tell us about a time you had to get up to speed quickly in an unfamiliar situation. What did you do?","Describe a setback that forced you to change your approach. How did you respond?","Give an example of a time your priorities changed unexpectedly. How did you adapt?","Tell us about a time you worked outside your comfort zone. What did you learn?","Describe a situation in which you received challenging feedback and changed how you worked.","What is a time you had to work effectively in a new environment or with unfamiliar people?"],"problem_solving":["Tell us about a complex problem you faced. How did you analyse it and decide what to do?","Describe a difficult decision you made when you did not have all the information you wanted.","Give an example of a time you found a practical solution to a problem others had struggled with.","Tell us about a time you had to balance competing priorities to deliver a result.","Describe a situation in which your first solution did not work. How did you proceed?","What is an example of a time you used evidence to challenge an assumption and improve an outcome?"],"commercial_awareness":["Which of Swire's businesses interests you most, and what makes it commercially attractive or challenging?","What do you see as an important opportunity for a diversified group such as Swire over the next few years?","What commercial challenge do you think one of Swire's operating businesses may face, and why?","How might changing customer expectations affect a Swire business that interests you?","If you joined a Swire operating business, what would you want to understand first about how it creates value?","What external trend could have a meaningful effect on a Swire business, and how might the business respond?"]};
function shuffled(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function buildQuestions(){return shuffled(Object.values(questionBank).map(group=>shuffled(group)[0]))}
let questions=buildQuestions();let stage=0,index=0,phase='prepare',seconds=30,tick=null,stream=null,recorder=null,chunks=[],currentClipUrl=null,capturedCount=0,skippedCount=0,levelTimer=null,practiceDone=false;const main=document.getElementById('main');const $=s=>document.querySelector(s);function steps(){document.getElementById('steps').innerHTML=names.map((n,i)=>`<div class="step ${i===stage?'active':i<stage?'done':''}"><div class="dot">${i<stage?'✓':i+1}</div>${n}</div>`).join('')}function stopTick(){clearInterval(tick);tick=null}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}clearInterval(levelTimer)}function discardClip(){if(currentClipUrl){URL.revokeObjectURL(currentClipUrl);currentClipUrl=null}}function move(s){stopTick();if((stage===3||stage===4)&&s!==stage)discardClip();stage=s;render()}function btn(label,fn,kind=''){return `<button class="btn ${kind}" onclick="${fn}">${label}</button>`}function render(){steps();$('#eyebrow').textContent=stage===4?`Interview question ${index+1} of ${questions.length}`:stage===5?'All done':'Candidate experience';if(stage===0)main.innerHTML=`<div class="topline">Swire Management Programme · unofficial practice</div><h1>Your next opportunity<br>starts here.</h1><p class="lead">Welcome to your practice video interview. Get comfortable with the format, try a sample question, and then work through six original prompts inspired by the programme’s published selection criteria.</p><div class="welcome-art"><div class="bubble">🎥</div></div><div class="meta"><div><b>About 20 minutes</b>Including setup and practice</div><div><b>6 questions</b>Plus a practice round</div><div><b>Session only</b>No submission</div></div>${btn('Get started →','move(1)')}`;if(stage===1)main.innerHTML=`<div class="topline">Before you begin</div><h1>Here’s how it works.</h1><p class="lead">Each question gives you 30 seconds to prepare and up to 90 seconds to record. Recording stops automatically. You can rewatch, retry, or continue after each answer, or skip a question while preparing or recording.</p><div class="checklist"><div class="item"><div class="icon">💡</div><div><strong>Find a quiet spot</strong><span>Good lighting and a stable connection make it easier to focus.</span></div></div><div class="item"><div class="icon">🎙️</div><div><strong>Check your setup</strong><span>We’ll ask for camera and microphone access before you practice.</span></div></div><div class="item"><div class="icon">⏱️</div><div><strong>Take your time</strong><span>You get 30 seconds to prepare and up to 90 seconds to respond.</span></div></div></div><div class="info"><h3>Just a demo</h3><p>Recordings stay in this browser session only. Each answer is discarded when you continue, retry, finish, restart, or leave the page.</p></div><div class="actions">${btn('Continue to device check →','move(2)')}${btn('Back','move(0)','ghost')}</div>`;if(stage===2)device();if(stage===3)practice();if(stage===4)interview();if(stage===5)complete()}
function device(){main.innerHTML=`<div class="topline">Make sure you’re ready</div><h1>Camera & microphone check</h1><p class="lead">Allow access when your browser asks. You’ll see your own video and a moving microphone meter.</p><div class="video" id="preview"><div class="placeholder"><em>◉</em>Camera preview will appear here</div></div><div class="device-row"><span>Camera</span><span class="status bad" id="cameraStatus">Not connected</span></div><div class="device-row"><span>Microphone</span><div class="meter"><i id="meterFill"></i></div><span class="status bad" id="micStatus">Not connected</span></div><p class="small" id="deviceMessage">Browser permission is required for live preview and recording.</p><div class="actions">${btn('Enable camera & microphone','enableDevices()')}${btn('Continue to practice →','move(3)','secondary')}${btn('Back','move(1)','ghost')}</div>`;if(stream)attachPreview()}
async function enableDevices(){try{stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('#cameraStatus').textContent='Connected';$('#cameraStatus').classList.remove('bad');$('#micStatus').textContent='Connected';$('#micStatus').classList.remove('bad');$('#deviceMessage').textContent='Your devices are ready.';attachPreview();const ac=new AudioContext(),source=ac.createMediaStreamSource(stream),an=ac.createAnalyser();an.fftSize=256;source.connect(an);const data=new Uint8Array(an.frequencyBinCount);levelTimer=setInterval(()=>{an.getByteFrequencyData(data);let avg=data.reduce((a,b)=>a+b,0)/data.length;let bar=$('#meterFill');if(bar)bar.style.width=Math.min(100,Math.max(4,avg*2))+'%'},100)}catch(e){$('#deviceMessage').textContent='Access was not granted. Check browser permissions, then try again. You can still explore the demo without recording.'}}
function attachPreview(){let box=$('#preview');if(box&&stream){box.innerHTML='<video autoplay muted playsinline></video><div class="video-label">Your preview</div>';box.querySelector('video').srcObject=stream}}
function practice(){stopTick();main.innerHTML=`<div class="topline">Practice round</div><h1>Give it a try.</h1><p class="lead">This warm-up isn’t part of the six interview questions. Record an answer, then rewatch it, retry, or continue.</p><div class="info"><h3>Your practice question</h3><div class="question" style="font-size:22px;margin-bottom:0">What is one experience that sparked your interest in working across different businesses or cultures?</div></div><div class="video" id="preview"><div class="placeholder"><em>◉</em>Camera preview</div></div><div class="actions" id="practiceActions">${btn('Start practice recording','startRecording(true)')}${btn('Skip practice →','move(4)','secondary')}${btn('Back','move(2)','ghost')}</div><p class="small" id="practiceNote">Stop whenever you’re ready. You can rewatch or retry before continuing.</p>`;attachPreview();if(practiceDone)$('#practiceNote').textContent='Practice complete. You can record again or continue.'}
function interview(){stopTick();phase='prepare';seconds=30;main.innerHTML=`<div class="topline">Question ${index+1} / ${questions.length}</div><div class="progress"><i style="width:${index/questions.length*100}%"></i></div><span class="timer" id="timer">Prepare · 0:30</span><div class="question">${questions[index]}</div><p id="phaseText">Take a moment to organize your thoughts. Recording starts when you press the button or when the timer reaches zero.</p><div class="video" id="preview"><div class="placeholder"><em>◉</em>Camera preview</div></div><div class="actions" id="interviewActions">${btn('Start recording now','beginAnswer()')}${btn('Skip question →','skipQuestion()','ghost')}${btn('Back to practice','move(3)','ghost')}</div><p class="small" id="recordNote"></p>`;attachPreview();startTimer(()=>beginAnswer())}
function startTimer(done){stopTick();updateTimer();tick=setInterval(()=>{seconds--;updateTimer();if(seconds<=0){stopTick();done()}},1000)}function updateTimer(){let el=$('#timer');if(el)el.textContent=`${phase==='prepare'?'Prepare':'Recording'} · ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
function startRecording(practice=false){if(!stream){let note=practice?$('#practiceNote'):$('#recordNote');if(note)note.innerHTML='<span class="warning">Enable your camera and microphone in Device check to record. You can continue through the demo without recording.</span>';return false}try{chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const parts=chunks;chunks=[];recorder=null;discardClip();const blob=new Blob(parts,{type:parts[0]?.type||'video/webm'});currentClipUrl=URL.createObjectURL(blob);if(practice)practiceDone=true;showReview(practice)};recorder.start();if(practice){$('#practiceActions').innerHTML=btn('Stop practice recording','stopRecording()');$('#practiceNote').textContent='Recording in progress…'}return true}catch(e){let note=practice?$('#practiceNote'):$('#recordNote');if(note)note.textContent='Recording is unavailable in this browser. You can continue with the demo.';return false}}
function showReview(practice=false){stopTick();if(!practice){phase='review';$('#timer').classList.remove('recording');$('#timer').textContent='Answer recorded';$('#phaseText').textContent='Review your response, record a new attempt, or continue to the next question.'}const box=$('#preview');box.classList.add('playback');box.innerHTML='<video id="answerPlayback" controls playsinline preload="metadata" aria-label="Your recorded answer"></video>';$('#answerPlayback').src=currentClipUrl;if(practice){$('#practiceActions').innerHTML=`${btn('Rewatch','rewatchAnswer()','secondary')}${btn('Retry','retryPractice()','ghost')}${btn('Continue to interview →','continuePractice()')}`;$('#practiceNote').textContent='This video is available only until you retry or continue.'}else{$('#interviewActions').innerHTML=`${btn('Rewatch','rewatchAnswer()','secondary')}${btn('Retry','retryAnswer()','ghost')}${btn(index===questions.length-1?'Finish interview →':'Continue →','continueAnswer()')}`;$('#recordNote').textContent='This video is available only until you retry or continue.'}}
function rewatchAnswer(){const video=$('#answerPlayback');if(video){video.currentTime=0;video.play().catch(()=>{})}}
function retryPractice(){discardClip();practiceDone=false;practice()}
function continuePractice(){discardClip();move(4)}
function retryAnswer(){discardClip();interview()}
function continueAnswer(){if(currentClipUrl)capturedCount++;nextQuestion()}
function stopRecording(){if(recorder&&recorder.state==='recording')recorder.stop()}function beginAnswer(){if(stage!==4||phase==='record')return;stopTick();phase='record';seconds=90;$('#timer').classList.add('recording');$('#phaseText').textContent='Answer in your own words. Your recording will stop after 90 seconds.';let started=startRecording(false);$('#interviewActions').innerHTML=started?`${btn('Finish answer','stopRecording()')}${btn('Skip question →','skipQuestion()','ghost')}`:btn('Skip question →','skipQuestion()','secondary');startTimer(()=>{if(started)stopRecording();else nextQuestion()})}function skipQuestion(){if(stage!==4||phase==='review')return;stopTick();if(recorder&&recorder.state==='recording'){recorder.ondataavailable=null;recorder.onstop=null;recorder.stop();recorder=null;chunks=[]}discardClip();skippedCount++;nextQuestion()}function nextQuestion(){stopTick();discardClip();if(index<questions.length-1){index++;interview()}else move(5)}function complete(){discardClip();stopCamera();let captured=capturedCount;main.innerHTML=`<div class="complete">✓</div><div class="topline">Interview complete</div><h1>Nice work — you did it.</h1><p class="lead">You’ve reached the end of your unofficial Swire Management Programme practice interview. Use what you learned to feel more prepared for the real conversation.</p><div class="info"><h3>Your practice summary</h3><p>${questions.length-skippedCount} questions completed · ${skippedCount} skipped · ${captured} answer${captured===1?'':'s'} recorded in this browser session${practiceDone?' · practice round completed':''}</p></div><p class="small">This is an unofficial practice demo. The question count and timing are practice estimates, not confirmed Swire interview settings. These are not confirmed Swire questions. Nothing was submitted or saved to a server. Recordings are discarded as you continue and when the session ends.</p><div class="actions">${btn('Practice again','restart()')}${btn('Review instructions','move(1)','secondary')}</div>`}function restart(){discardClip();stopCamera();capturedCount=0;skippedCount=0;practiceDone=false;index=0;questions=buildQuestions();move(0)}render();window.addEventListener('pagehide',()=>{discardClip();stopCamera()});
</script></body></html>
